  - { id: 4, category: thanks, messages: ['شكرا ليكي'], expect: { tier: ['0'], handover: false } }
  - { id: 5, category: menu, messages: ['منيو'], expect: { tier: ['0'], flow: main_menu } }
  - { id: 6, category: slot, setup: { flow: order_tracking }, messages: ['209129'], expect: { tier: ['0'], never: ['ممكن رقم الأوردر'] } }
