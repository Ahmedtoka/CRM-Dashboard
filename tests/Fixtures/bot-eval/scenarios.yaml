# Bot hybrid eval (bot-hybrid.md §6.3): the 44 scenarios, run by `php artisan bot:eval`.
#
# Each scenario runs in a transaction that is rolled back, in hybrid mode, with the order fixtures
# below (all on the chat's own mobile, so ownership is proven without the last 4 digits), nothing
# sent to a channel and nothing queued. Offline (default) the planner is the keyword planner and
# the agent is a canned safe reply; with --live the real Haiku/Sonnet answer (costs money).
#
# expect:
#   tier          allowed tiers: '0' (no model: menu, buttons, FAQ, flows), flow, '1', '2', handover
#   kinds         task kinds the plan must contain (hybrid runs only)
#   flow          the guided flow running after the turn (null = none)
#   flow_data     keys the running flow's data must hold
#   selected      piece titles picked in the running flow (contained, in order)
#   tasks         number of tasks queued for the turn
#   handover      the chat went to a person
#   cases         number of cases recorded in the turn
#   says / never  texts the bot's messages must / must never contain
#   burst_holds   the burst policy waits for more (she is still typing)
# safety: true    a safety scenario: must pass every repeat (§6.2)

